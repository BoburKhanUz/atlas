name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Syntactically valid only; nothing connects to it at build/test time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - name: Install (runs prisma generate via postinstall)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: OpenAPI document is current and valid
        run: bun run openapi:check && bun run openapi:validate
      - name: Build
        run: bun run build

  e2e:
    name: e2e (playwright)
    # Pinned: Playwright installs browsers and their system packages per
    # Ubuntu release, and the pinned @playwright/test has none for a release
    # newer than it (ubuntu-latest moved to 26.04 and the install failed).
    # Raise this together with @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: atlas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d atlas_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/atlas_e2e
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/atlas_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: Build (standalone)
        run: bun run build
      - name: Apply migrations
        run: bunx prisma migrate deploy
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          # Random throwaway secrets, generated per run; masked in logs.
          JWT_SECRET="$(openssl rand -hex 32)"
          MEDIA_SIGNING_SECRET="$(openssl rand -hex 32)"
          SESSION_ENC_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$MEDIA_SIGNING_SECRET"
          echo "::add-mask::$SESSION_ENC_KEY"
          export JWT_SECRET MEDIA_SIGNING_SECRET SESSION_ENC_KEY
          export STORAGE_LOCAL_DIR="$RUNNER_TEMP/atlas-e2e-storage"
          mkdir -p "$STORAGE_LOCAL_DIR"
          bun run test:e2e
      # Go mode (docs/plan/B2.md, B3.md): the same browser specs with the
      # operations the Go backend already serves answered by Go, behind a
      # test-only proxy (e2e/go-front.mjs), on the same database and secrets
      # as Next.js; the Go worker (e2e/go-worker.mjs) sends the queued mail
      # to the outbox directory. The runner's Go switches itself to the
      # toolchain pinned in go.mod.
      - name: Build the Go server
        working-directory: apps/api
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/lookly" ./cmd/lookly
      - name: Run the session and account e2e specs in Go mode
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          MEDIA_SIGNING_SECRET="$(openssl rand -hex 32)"
          SESSION_ENC_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$MEDIA_SIGNING_SECRET"
          echo "::add-mask::$SESSION_ENC_KEY"
          export JWT_SECRET MEDIA_SIGNING_SECRET SESSION_ENC_KEY
          export STORAGE_LOCAL_DIR="$RUNNER_TEMP/atlas-e2e-storage-go"
          mkdir -p "$STORAGE_LOCAL_DIR"
          export E2E_GO=1 E2E_GO_BINARY="$RUNNER_TEMP/lookly"
          npx playwright test auth.spec.ts session.spec.ts session-recovery.spec.ts go-mode.spec.ts password-reset.spec.ts reconsent.spec.ts navigation-responsive.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  migrations:
    name: migrations (deploy + drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SHADOW_URL: postgresql://ci:ci@localhost:5432/shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bunx prisma migrate deploy
      - name: Create shadow database
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d ci -c 'CREATE DATABASE shadow'
      - name: Drift check (migrations vs schema.prisma)
        run: >-
          bunx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_URL"
          --exit-code

  integration:
    name: integration (real PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_ITEST_PGHOST: localhost
      ATLAS_ITEST_PGPORT: "5432"
      ATLAS_ITEST_PGUSER: ci
      ATLAS_ITEST_PGPASSWORD: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: PostgreSQL 16 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Server settings the tests rely on (commit timestamps, non-UTC zone)
        env:
          PGPASSWORD: ci
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql -h localhost -U ci -d ci -c "ALTER SYSTEM SET track_commit_timestamp = on" -c "ALTER SYSTEM SET timezone = 'Asia/Tashkent'"
          docker restart "$PG_CONTAINER"
          until pg_isready -h localhost -U ci -d ci; do sleep 1; done
          psql -h localhost -U ci -d ci -Atc "SHOW track_commit_timestamp"
      - name: Integration tests (migrations, cutover, session protocol)
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" bun run test:integration

  dart-client:
    # Non-blocking: proves the OpenAPI document generates a compilable Dart
    # client for the mobile app. Pinned images; nothing generated is committed.
    name: dart client from OpenAPI (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate dart-dio client
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work"
          openapitools/openapi-generator-cli:v7.10.0 generate
          -i /work/docs/api/openapi.json -g dart-dio -o /work/.dart-client
          --additional-properties=pubName=atlas_api
      - name: Build and analyze (errors fail, generator lint warnings do not)
        run: >-
          docker run --rm -v "$PWD/.dart-client:/client" -w /client dart:3.5.4
          sh -c "dart pub get && dart run build_runner build --delete-conflicting-outputs && dart analyze --no-fatal-warnings"

  docker:
    name: docker (build + compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build apps/web
      - name: Build the API image (no push)
        run: docker build --build-arg VERSION=ci apps/api
      - name: Validate docker-compose.yml with generated dummy env
        run: |
          # Random throwaway values, generated per run; nothing is stored.
          {
            echo "POSTGRES_DB=atlas"
            echo "POSTGRES_USER=atlas"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "MEDIA_SIGNING_SECRET=$(openssl rand -hex 32)"
            echo "SESSION_ENC_KEY=$(openssl rand -base64 32)"
          } > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config --quiet
      - name: Validate the server overlay (deploy/) and its Caddyfile
        run: |
          # Same throwaway values plus a placeholder domain; nothing is stored.
          { cat "$RUNNER_TEMP/ci.env"; echo "ATLAS_DOMAIN=staging-api.example.com"; } > "$RUNNER_TEMP/server.env"
          docker compose -f docker-compose.yml -f deploy/compose.server.yml --env-file "$RUNNER_TEMP/server.env" config --quiet
          docker run --rm -e ATLAS_DOMAIN=staging-api.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for scanning
          persist-credentials: false
      # Official image, not gitleaks-action (license requirement).
      - name: gitleaks detect
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.18.4
          detect --source /repo --redact --verbose

  api:
    # Go backend (apps/api). The runner's Go switches itself to the toolchain
    # pinned in go.mod (checksum-verified); tool versions are pinned here.
    name: "api (Go: generate, vet, staticcheck, test, integration, vulncheck)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lookly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lookly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOKLY_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/lookly_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: go version
      - name: Generated code matches docs/api/openapi.json
        run: scripts/generate.sh --check
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./... && go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration ./...
      - name: Tests, with the integration tests against PostgreSQL 16
        run: go test -race -tags integration ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/lookly" ./cmd/lookly

  repo-rules:
    # Workflow security (actionlint, zizmor) and the Claude Code project
    # skills (frontmatter, length, referenced files). Tool versions pinned.
    name: repo-rules (workflow lint, zizmor, skills)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: zizmor (offline audits)
        run: pipx run zizmor==1.14.2 --offline .github/workflows
      - name: Project skills are well-formed
        run: python3 -I .github/scripts/check_skills.py

  mobile:
    # Flutter app (apps/mobile). Pinned toolchain; no secrets: the debug APK
    # uses the committed development config, release signing is only probed
    # with Gradle dry runs.
    name: mobile (format, analyze, test, debug APK, API client drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloads (plugins, Kotlin, AndroidX) are cached: Maven
          # Central rate-limits runners (HTTP 429 failed this build twice on
          # 2026-11-25 with no code change).
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        # Real-backend integration tests skip themselves without
        # ATLAS_ITEST_BASE_URL; they run against a disposable backend only.
        run: flutter test
      - name: Repository hygiene (no signing material, builds or local config)
        run: |
          bad=$(git ls-files . | grep -E '(^|/)(key\.properties|local\.properties)$|\.(jks|keystore|p12|apk|aab|ipa)$|^config/(staging|production)\.json$' || true)
          if [ -n "$bad" ]; then echo "tracked files that must not be committed:"; echo "$bad"; exit 1; fi
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK (development config)
        # Retried only when Gradle could not download from the registries
        # (rate limit, network); any other failure fails at once.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if flutter build apk --debug --dart-define-from-file=config/development.json 2>&1 | tee "$RUNNER_TEMP/apk-build.log"; then
              exit 0
            fi
            if ! grep -qE "Too Many Requests|error while downloading artifacts from the network" "$RUNNER_TEMP/apk-build.log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle could not download dependencies (attempt $attempt of 3); retrying in $((attempt * 45)) s"
              sleep "$((attempt * 45))"
            fi
          done
          exit 1
      - name: Release signing guard fails closed
        run: tool/check_release_signing_guard.sh
      - name: Generated API client matches docs/api/openapi.json
        run: tool/openapi/generate_api.sh --check
