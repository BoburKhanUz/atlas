name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: OpenAPI document is valid
        run: bun run openapi:validate
      - name: Build
        run: bun run build

  e2e:
    name: e2e (playwright)
    # Pinned: Playwright installs browsers and their system packages per
    # Ubuntu release, and the pinned @playwright/test has none for a release
    # newer than it (ubuntu-latest moved to 26.04 and the install failed).
    # Raise this together with @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: atlas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d atlas_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/atlas_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: Build (standalone)
        run: bun run build
      # The runner's Go switches itself to the toolchain pinned in go.mod.
      - name: Build the Go server
        working-directory: apps/api
        run: CGO_ENABLED=0 go build -trimpath -tags nodynamic -o "$RUNNER_TEMP/lookly" ./cmd/lookly
      # The schema is the Go server's (docs/plan/B7.md, B7.3): `lookly migrate`
      # makes it, and the queue's tables, on the empty database.
      - name: Apply migrations
        env:
          LOOKLY_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/atlas_e2e
        run: '"$RUNNER_TEMP/lookly" migrate'
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # The website's pages (landing, legal, the reset-link page) from the
      # production build, the API from the Go server and its worker, behind
      # e2e/go-front.mjs as behind Caddy (playwright.config.ts). Secrets are
      # random per run.
      - name: Browser suite (the website against Go)
        run: E2E_GO_BINARY="$RUNNER_TEMP/lookly" bun run test:e2e
      # The AI evaluation's scripted cases through `lookly eval` (docs/plan/B6.md,
      # B6.9, and B7.4). Offline: a stand-in on 127.0.0.1 answers, no key is read.
      - name: AI evaluation on the Go pipeline (offline)
        run: LOOKLY_BINARY="$RUNNER_TEMP/lookly" bun run test:eval-go
      # The API journeys against the Go server and its worker (docs/plan/B7.md,
      # B7.2), every answer checked against docs/api/openapi.json; secrets are
      # random per run (playwright.api.config.ts).
      - name: API journeys against Go
        run: E2E_GO_BINARY="$RUNNER_TEMP/lookly" bun run test:api-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  dart-client:
    # Non-blocking: proves the OpenAPI document generates a compilable Dart
    # client for the mobile app. Pinned images; nothing generated is committed.
    name: dart client from OpenAPI (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate dart-dio client
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work"
          openapitools/openapi-generator-cli:v7.10.0 generate
          -i /work/docs/api/openapi.json -g dart-dio -o /work/.dart-client
          --additional-properties=pubName=atlas_api
      - name: Build and analyze (errors fail, generator lint warnings do not)
        run: >-
          docker run --rm -v "$PWD/.dart-client:/client" -w /client dart:3.5.4
          sh -c "dart pub get && dart run build_runner build --delete-conflicting-outputs && dart analyze --no-fatal-warnings"

  docker:
    name: docker (images, the stack through Caddy, compose config)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Throwaway settings for this run
        run: |
          # Random values, generated per run; nothing is stored.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "MEDIA_SIGNING_SECRET=$(openssl rand -base64 48)"
            echo "SESSION_ENC_KEY=$(openssl rand -base64 32)"
            echo "WEATHER_PROVIDER=mock"
          } > "$RUNNER_TEMP/ci.env"
      - name: Build the images (API and website)
        run: docker compose -p ci --env-file "$RUNNER_TEMP/ci.env" build
      # The whole stack of docker-compose.yml (PostgreSQL, lookly migrate, the
      # API, the worker, the website, Caddy), checked through Caddy: routing,
      # security headers, sign-up, an upload, its signed image, the reset mail.
      - name: Start the stack and check it through Caddy
        run: |
          docker compose -p ci --env-file "$RUNNER_TEMP/ci.env" up -d --no-build --wait
          python3 -I deploy/check-stack.py http://127.0.0.1:3000 --outbox-volume ci_mail-outbox
      - name: Logs of the stack
        if: failure()
        run: docker compose -p ci --env-file "$RUNNER_TEMP/ci.env" logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -p ci --env-file "$RUNNER_TEMP/ci.env" down -v
      - name: Validate the server overlay (deploy/) and its Caddyfile
        run: |
          # Same throwaway values plus a server's settings; nothing is stored.
          { cat "$RUNNER_TEMP/ci.env"; echo "ATLAS_DOMAIN=staging-api.example.com"; echo "LOOKLY_ENV=staging"; } > "$RUNNER_TEMP/server.env"
          docker compose -f docker-compose.yml -f deploy/compose.server.yml --env-file "$RUNNER_TEMP/server.env" config --quiet
          docker run --rm -e SITE_ADDRESS=staging-api.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history for scanning
          persist-credentials: false
      # Official image, not gitleaks-action (license requirement).
      - name: gitleaks detect
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.18.4
          detect --source /repo --redact --verbose

  api:
    # Go backend (apps/api). The runner's Go switches itself to the toolchain
    # pinned in go.mod (checksum-verified); tool versions are pinned here.
    name: "api (Go: generate, vet, staticcheck, test, integration, vulncheck)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lookly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lookly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOKLY_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/lookly_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: go version
      - name: Generated code matches docs/api/openapi.json
        run: scripts/generate.sh --check
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet -tags nodynamic ./... && go vet -tags integration,nodynamic ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration,nodynamic ./...
      - name: Tests, with the integration tests against PostgreSQL 16
        # nodynamic: the WebP encoder is the transpiled one, never a libwebp
        # of the runner (ADR 0009); without it the imaging and server tests fail.
        # Two runs: under the race detector the two image packages keep every
        # core busy for minutes; on their own they leave more room to the
        # tests that are held to real time limits. Every package is in one
        # run or the other: the first takes all but the two named.
        run: |
          go list ./... | grep -v -x -e lookly/internal/imaging -e lookly/internal/vision \
            | xargs go test -race -tags integration,nodynamic
          go test -race -tags integration,nodynamic ./internal/imaging/ ./internal/vision/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -tags nodynamic -o "$RUNNER_TEMP/lookly" ./cmd/lookly

  repo-rules:
    # Workflow security (actionlint, zizmor) and the Claude Code project
    # skills (frontmatter, length, referenced files). Tool versions pinned.
    name: repo-rules (workflow lint, zizmor, skills)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: zizmor (offline audits)
        run: pipx run zizmor==1.14.2 --offline .github/workflows
      - name: Project skills are well-formed
        run: python3 -I .github/scripts/check_skills.py

  mobile:
    # Flutter app (apps/mobile). Pinned toolchain; no secrets: the debug APK
    # uses the committed development config, release signing is only probed
    # with Gradle dry runs.
    name: mobile (format, analyze, test, debug APK, API client drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloads (plugins, Kotlin, AndroidX) are cached: Maven
          # Central rate-limits runners (HTTP 429 failed this build twice on
          # 2026-11-25 with no code change).
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: Install dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        # Real-backend integration tests skip themselves without
        # ATLAS_ITEST_BASE_URL; they run against a disposable backend only.
        run: flutter test
      - name: Repository hygiene (no signing material, builds or local config)
        run: |
          bad=$(git ls-files . | grep -E '(^|/)(key\.properties|local\.properties)$|\.(jks|keystore|p12|apk|aab|ipa)$|^config/(staging|production)\.json$' || true)
          if [ -n "$bad" ]; then echo "tracked files that must not be committed:"; echo "$bad"; exit 1; fi
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK (development config)
        # Retried only when Gradle could not download from the registries
        # (rate limit, network); any other failure fails at once.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if flutter build apk --debug --dart-define-from-file=config/development.json 2>&1 | tee "$RUNNER_TEMP/apk-build.log"; then
              exit 0
            fi
            if ! grep -qE "Too Many Requests|error while downloading artifacts from the network" "$RUNNER_TEMP/apk-build.log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle could not download dependencies (attempt $attempt of 3); retrying in $((attempt * 45)) s"
              sleep "$((attempt * 45))"
            fi
          done
          exit 1
      - name: Release signing guard fails closed
        run: tool/check_release_signing_guard.sh
      - name: Generated API client matches docs/api/openapi.json
        run: tool/openapi/generate_api.sh --check
