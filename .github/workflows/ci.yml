name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Syntactically valid only; nothing connects to it at build/test time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install (runs prisma generate via postinstall)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: atlas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d atlas_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/atlas_e2e
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/atlas_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: Build (standalone)
        run: bun run build
      - name: Apply migrations
        run: bunx prisma migrate deploy
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          # Random throwaway secrets, generated per run; masked in logs.
          JWT_SECRET="$(openssl rand -hex 32)"
          MEDIA_SIGNING_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$MEDIA_SIGNING_SECRET"
          export JWT_SECRET MEDIA_SIGNING_SECRET
          export STORAGE_LOCAL_DIR="$RUNNER_TEMP/atlas-e2e-storage"
          mkdir -p "$STORAGE_LOCAL_DIR"
          bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  migrations:
    name: migrations (deploy + drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SHADOW_URL: postgresql://ci:ci@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bunx prisma migrate deploy
      - name: Create shadow database
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d ci -c 'CREATE DATABASE shadow'
      - name: Drift check (migrations vs schema.prisma)
        run: >-
          bunx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_URL"
          --exit-code

  docker:
    name: docker (build + compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build apps/web
      - name: Validate docker-compose.yml with generated dummy env
        run: |
          # Random throwaway values, generated per run; nothing is stored.
          {
            echo "POSTGRES_DB=atlas"
            echo "POSTGRES_USER=atlas"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "MEDIA_SIGNING_SECRET=$(openssl rand -hex 32)"
          } > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config --quiet

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for scanning
      # Official image, not gitleaks-action (license requirement).
      - name: gitleaks detect
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.18.4
          detect --source /repo --redact --verbose
