# Server overlay for docker-compose.yml (staging and production): HTTPS through
# Caddy on the domain, no database or app port on the host, restart policies,
# bounded logs. Runbook: docs/deploy/staging.md. Always run it through
# deploy/compose.sh, which adds the base file, this file and deploy/server.env:
#   deploy/compose.sh up -d --build

name: atlas

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  migrate:
    logging: *logging
    environment:
      LOOKLY_ENV: ${LOOKLY_ENV:?Set LOOKLY_ENV in deploy/server.env (staging or production)}

  api:
    restart: unless-stopped
    logging: *logging
    environment:
      # staging or production (deploy/server.env); never development here.
      LOOKLY_ENV: ${LOOKLY_ENV:?Set LOOKLY_ENV in deploy/server.env (staging or production)}
      # Absolute image URLs and reset links for the phone app.
      PUBLIC_BASE_URL: https://${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in deploy/server.env}

  worker:
    restart: unless-stopped
    logging: *logging
    environment:
      LOOKLY_ENV: ${LOOKLY_ENV:?Set LOOKLY_ENV in deploy/server.env (staging or production)}
      PUBLIC_BASE_URL: https://${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in deploy/server.env}

  web:
    restart: unless-stopped
    logging: *logging

  caddy:
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in deploy/server.env}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
