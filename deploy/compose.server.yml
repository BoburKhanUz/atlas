# Server overlay for docker-compose.yml (staging and production): HTTPS through
# Caddy, no database or app port on the host, restart policies, bounded logs.
# Runbook: docs/deploy/staging.md. Always run it through deploy/compose.sh,
# which adds the base file, this file and deploy/server.env:
#   deploy/compose.sh up -d --build

name: atlas

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  migrate:
    logging: *logging

  web:
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    environment:
      # Caddy is the only client and replaces X-Forwarded-For: per-IP auth rate limits work.
      TRUST_PROXY: "1"
      # Absolute image URLs for the mobile app.
      PUBLIC_BASE_URL: https://${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in deploy/server.env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Cost estimates in ai.call logs (USD per million tokens; both of a pair or neither).
      AI_LLM_PRICE_INPUT_USD_PER_MTOK: ${AI_LLM_PRICE_INPUT_USD_PER_MTOK:-}
      AI_LLM_PRICE_OUTPUT_USD_PER_MTOK: ${AI_LLM_PRICE_OUTPUT_USD_PER_MTOK:-}
      AI_VISION_PRICE_INPUT_USD_PER_MTOK: ${AI_VISION_PRICE_INPUT_USD_PER_MTOK:-}
      AI_VISION_PRICE_OUTPUT_USD_PER_MTOK: ${AI_VISION_PRICE_OUTPUT_USD_PER_MTOK:-}

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in deploy/server.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-data:
  caddy-config:
