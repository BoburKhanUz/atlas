# gitleaks configuration (CI job "secret-scan"). The default rules apply
# everywhere; this file only names what is known not to be a secret.
[extend]
useDefault = true

[allowlist]
description = "Golden vectors: tokens and keys recorded from the TypeScript backend with fixed test secrets that are used nowhere else (apps/web/scripts/golden-auth.ts). And two literals: the password the Go tests set in a password reset, which the generic rule takes for a key (it protects nothing); and the example access key id of AWS's own documentation of Signature Version 4, published there with its example secret, which the signing test must use to reproduce the documented signatures (apps/api/internal/storage/sigv4_test.go). Nothing else is exempt."
paths = [
  '''^apps/api/testdata/golden/[^/]+\.json$''',
]
regexes = [
  '''^yangi-parol-5678$''',
  '''^AKIAIOSFODNN7EXAMPLE$''',
]
