name: atlas_mobile
description: "ATLAS — AI personal fashion stylist (native mobile app)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  atlas_api:
    path: packages/atlas_api
  built_collection: ^5.1.2
  built_value: ^8.13.0
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.0.2
  image_picker: ^1.2.3
  material_ui: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Brand typeface (SIL Open Font License, assets/fonts/Manrope-OFL.txt).
  assets:
    - assets/fonts/Manrope-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
