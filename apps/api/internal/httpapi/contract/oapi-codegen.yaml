# Generates the server interface and types from docs/api/openapi.json (ADR 0008).
# Only implemented operations are included; each stage adds its own. The test
# TestOperationsNotYetImplemented lists the rest until B7.
package: contract
output: contract.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
output-options:
  nullable-type: true
  # An email is a plain string here: requests are validated by our own rules
  # (the contract's pattern, the Next.js API's messages) before the generated
  # decoder sees them, and the generator's own email type parses addresses
  # by other rules.
  type-mapping:
    string:
      formats:
        email:
          type: string
    # A JSON number is a double, as the Next.js API reads it (the generator's
    # default is a float32, which would round what clients send).
    number:
      default:
        type: float64
  include-operation-ids:
    - getHealth
    - register
    - login
    - logout
    - getMe
    - refreshSession
    - getLegalDocuments
    - acceptLegalDocuments
    - getProfile
    - updateProfile
    - requestPasswordReset
    - resetPassword
    - deleteAccount
    - listWardrobeItems
    - getWardrobeItem
    - updateWardrobeItem
    - deleteWardrobeItem
